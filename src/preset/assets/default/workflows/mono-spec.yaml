id: mono-spec
mode: linear
phaseOrder:
  - tech_spec_draft
  - tech_spec_validate
  - tech_spec_patch
  - implementation_plan_create
  - implementation_plan_validate
  - implementation_plan_patch
  - implementation
  - focused_tests
  - safe_refactor
  - pr_prepare
phases:
  tech_spec_draft:
    title: "기술 명세서 업데이트"
    stepNumber: "1"
    stepTitle: "기술 명세서 업데이트"
    template: mono-spec/tech_spec_draft.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SOURCE_PROBLEM_FILE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
  tech_spec_validate:
    title: "기술 교차 검증"
    stepNumber: "2"
    stepTitle: "기술 교차 검증"
    template: mono-spec/tech_spec_validate.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SOURCE_PROBLEM_FILE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
    gate:
      results:
        - approved
        - needs_revision
      nextByResult:
        approved: implementation_plan_create
        needs_revision: tech_spec_patch
  tech_spec_patch:
    title: "기술 명세서 업데이트"
    stepNumber: "3"
    stepTitle: "기술 명세서 업데이트"
    template: mono-spec/tech_spec_patch.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
    next: tech_spec_validate
  implementation_plan_create:
    title: "구현 계획서 생성"
    stepNumber: "4"
    stepTitle: "구현 계획서 생성"
    template: mono-spec/implementation_plan_create.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
  implementation_plan_validate:
    title: "구현 계획서 교차 검증"
    stepNumber: "5"
    stepTitle: "구현 계획서 교차 검증"
    template: mono-spec/implementation_plan_validate.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
    gate:
      results:
        - approved
        - needs_revision
      nextByResult:
        approved: implementation
        needs_revision: implementation_plan_patch
  implementation_plan_patch:
    title: "구현 계획서 업데이트"
    stepNumber: "6"
    stepTitle: "구현 계획서 업데이트"
    template: mono-spec/implementation_plan_patch.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
    next: implementation_plan_validate
  implementation:
    title: "기술 구현"
    stepNumber: "7"
    stepTitle: "기술 구현"
    template: mono-spec/implementation.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
  focused_tests:
    title: "테스트"
    stepNumber: "8"
    stepTitle: "테스트"
    template: mono-spec/focused_tests.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
  safe_refactor:
    title: "리팩토링"
    stepNumber: "9"
    stepTitle: "리팩토링"
    template: mono-spec/safe_refactor.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - TARGET_BRANCH
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
  pr_prepare:
    title: "PR 준비"
    stepNumber: "10"
    stepTitle: "PR 준비"
    template: mono-spec/pr_prepare.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - TARGET_BRANCH
      - SPEC_FILE
      - PLAN_FILE
      - RESULT_FILE
      - PR_FILE
