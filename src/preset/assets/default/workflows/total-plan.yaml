id: total-plan
mode: linear
phaseOrder:
  - total_spec_draft
  - total_spec_validate
  - total_spec_patch
  - phase_plan_create
  - phase_plan_validate
  - phase_plan_patch
  - final_review
phases:
  total_spec_draft:
    title: "Total Technical Spec Draft"
    stepNumber: "1"
    stepTitle: "Total Technical Spec Draft"
    template: total-plan/total_spec_draft.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SOURCE_PROBLEM_FILE
      - CONTEXT_FILES
      - CONTEXT_REFS_DETAIL
      - TOTAL_SPEC_FILE
      - PHASE_PLAN_FILE
      - RESULT_FILE
    outputs:
      - "{{TOTAL_SPEC_FILE}}"
  total_spec_validate:
    title: "Total Technical Spec Validation"
    stepNumber: "2"
    stepTitle: "Total Technical Spec Validation"
    template: total-plan/total_spec_validate.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SOURCE_PROBLEM_FILE
      - CONTEXT_FILES
      - CONTEXT_REFS_DETAIL
      - TOTAL_SPEC_FILE
      - PHASE_PLAN_FILE
      - RESULT_FILE
    outputs:
      - "{{TOTAL_SPEC_FILE}}"
    gate:
      results:
        - approved
        - needs_revision
      nextByResult:
        approved: phase_plan_create
        needs_revision: total_spec_patch
  total_spec_patch:
    title: "Total Technical Spec Patch"
    stepNumber: "3"
    stepTitle: "Total Technical Spec Patch"
    template: total-plan/total_spec_patch.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - TOTAL_SPEC_FILE
      - PHASE_PLAN_FILE
      - RESULT_FILE
    outputs:
      - "{{TOTAL_SPEC_FILE}}"
    next: total_spec_validate
  phase_plan_create:
    title: "Phase Implementation Plan Create"
    stepNumber: "4"
    stepTitle: "Phase Implementation Plan Create"
    template: total-plan/phase_plan_create.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - SOURCE_PROBLEM_FILE
      - CONTEXT_FILES
      - CONTEXT_REFS_DETAIL
      - TOTAL_SPEC_FILE
      - PHASE_PLAN_FILE
      - RESULT_FILE
    outputs:
      - "{{PHASE_PLAN_FILE}}"
  phase_plan_validate:
    title: "Phase Implementation Plan Validation"
    stepNumber: "5"
    stepTitle: "Phase Implementation Plan Validation"
    template: total-plan/phase_plan_validate.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - TOTAL_SPEC_FILE
      - PHASE_PLAN_FILE
      - RESULT_FILE
    outputs:
      - "{{PHASE_PLAN_FILE}}"
    gate:
      results:
        - approved
        - needs_revision
      nextByResult:
        approved: final_review
        needs_revision: phase_plan_patch
  phase_plan_patch:
    title: "Phase Implementation Plan Patch"
    stepNumber: "6"
    stepTitle: "Phase Implementation Plan Patch"
    template: total-plan/phase_plan_patch.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - TOTAL_SPEC_FILE
      - PHASE_PLAN_FILE
      - RESULT_FILE
    outputs:
      - "{{PHASE_PLAN_FILE}}"
    next: phase_plan_validate
  final_review:
    title: "Final Planning Review"
    stepNumber: "7"
    stepTitle: "Final Planning Review"
    template: total-plan/final_review.md
    requiredVariables:
      - FEATURE_SLUG
      - TASK_TITLE
      - TOTAL_SPEC_FILE
      - PHASE_PLAN_FILE
      - RESULT_FILE
    outputs:
      - "{{RESULT_FILE}}"
    next: null
