id: simple-bug
name: Simple Bug
description: Legacy simple bug workflow.
version: 1
mode: linear
variables:
  FEATURE_SLUG:
    required: true
  PHASE_SPEC_FILE:
    default: "docs/{{FEATURE_SLUG}}/{{FEATURE_SLUG}}_phase{{PHASE_NUMBER}}_implementation_spec.md"
  PHASE_HANDOFF_FILE:
    default: "docs/{{FEATURE_SLUG}}/{{FEATURE_SLUG}}_phase{{PHASE_NUMBER}}_handoff.md"
artifacts:
  phaseSpec:
    path: "{{PHASE_SPEC_FILE}}"
    kind: spec
  phaseHandoff:
    path: "{{PHASE_HANDOFF_FILE}}"
    kind: handoff
phaseOrder:
  - "1"
  - "2"
phases:
  "1":
    title: "Phase 1 — Investigation & Fix"
    template: phase_template.md
    requiredVariables:
      - FEATURE_SLUG
      - PHASE_NUMBER
      - PHASE_SPEC_FILE
      - PHASE_HANDOFF_FILE
      - TASK_ID
      - TASK_TITLE
      - WORKFLOW_TYPE
  "2":
    title: "Phase 2 — Verification"
    template: phase_template.md
    requiredVariables:
      - FEATURE_SLUG
      - PHASE_NUMBER
      - PHASE_SPEC_FILE
      - PHASE_HANDOFF_FILE
      - TASK_ID
      - TASK_TITLE
      - WORKFLOW_TYPE
