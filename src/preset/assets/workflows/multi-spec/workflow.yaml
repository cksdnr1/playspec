id: multi-spec
name: Multi Spec
description: Legacy multi-phase workflow.
version: 1
mode: linear
variables:
  FEATURE_SLUG:
    required: true
  PHASE_SPEC_FILE:
    default: "docs/{{FEATURE_SLUG}}/{{FEATURE_SLUG}}_phase{{PHASE_NUMBER}}_implementation_spec.md"
  PHASE_HANDOFF_FILE:
    default: "docs/{{FEATURE_SLUG}}/{{FEATURE_SLUG}}_phase{{PHASE_NUMBER}}_handoff.md"
artifacts:
  phaseSpec:
    path: "{{PHASE_SPEC_FILE}}"
    kind: spec
  phaseHandoff:
    path: "{{PHASE_HANDOFF_FILE}}"
    kind: handoff
phaseOrder:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
phases:
  "1":
    title: "Phase 1 — Spec & Planning"
    template: phase_template.md
    requiredVariables:
      - FEATURE_SLUG
      - PHASE_NUMBER
      - PHASE_SPEC_FILE
      - PHASE_HANDOFF_FILE
      - TASK_ID
      - TASK_TITLE
      - WORKFLOW_TYPE
  "2":
    title: "Phase 2 — Implementation Spec"
    template: phase_template.md
    requiredVariables:
      - FEATURE_SLUG
      - PHASE_NUMBER
      - PHASE_SPEC_FILE
      - PHASE_HANDOFF_FILE
      - TASK_ID
      - TASK_TITLE
      - WORKFLOW_TYPE
  "3":
    title: "Phase 3 — Implementation"
    template: phase_template.md
    requiredVariables:
      - FEATURE_SLUG
      - PHASE_NUMBER
      - PHASE_SPEC_FILE
      - PHASE_HANDOFF_FILE
      - TASK_ID
      - TASK_TITLE
      - WORKFLOW_TYPE
  "4":
    title: "Phase 4 — Verification"
    template: phase_template.md
    requiredVariables:
      - FEATURE_SLUG
      - PHASE_NUMBER
      - PHASE_SPEC_FILE
      - PHASE_HANDOFF_FILE
      - TASK_ID
      - TASK_TITLE
      - WORKFLOW_TYPE
  "5":
    title: "Phase 5 — Review"
    template: phase_template.md
    requiredVariables:
      - FEATURE_SLUG
      - PHASE_NUMBER
      - PHASE_SPEC_FILE
      - PHASE_HANDOFF_FILE
      - TASK_ID
      - TASK_TITLE
      - WORKFLOW_TYPE
